<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4fa8"/>
      <stop offset="100%" style="stop-color:#0d2d6b"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#cce0ff;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle globe grid lines -->
  <circle cx="512" cy="480" r="310" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="512" cy="480" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="512" cy="480" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <line x1="202" y1="480" x2="822" y2="480" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <line x1="512" y1="170" x2="512" y2="790" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <ellipse cx="512" cy="480" rx="155" ry="310" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Location pin -->
  <g filter="url(#shadow)">
    <!-- Pin body (teardrop shape) -->
    <path d="M512 195
             C390 195 290 295 290 417
             C290 539 400 640 512 829
             C624 640 734 539 734 417
             C734 295 634 195 512 195Z"
          fill="url(#pinGrad)"/>

    <!-- Inner circle cutout -->
    <circle cx="512" cy="400" r="105" fill="#1a4fa8"/>

    <!-- Sun rays inside circle -->
    <circle cx="512" cy="400" r="52" fill="#FFD04A"/>
    <line x1="512" y1="330" x2="512" y2="310" stroke="#FFD04A" stroke-width="16" stroke-linecap="round"/>
    <line x1="512" y1="470" x2="512" y2="490" stroke="#FFD04A" stroke-width="16" stroke-linecap="round"/>
    <line x1="442" y1="400" x2="422" y2="400" stroke="#FFD04A" stroke-width="16" stroke-linecap="round"/>
    <line x1="582" y1="400" x2="602" y2="400" stroke="#FFD04A" stroke-width="16" stroke-linecap="round"/>
    <line x1="462" y1="350" x2="448" y2="336" stroke="#FFD04A" stroke-width="14" stroke-linecap="round"/>
    <line x1="562" y1="450" x2="576" y2="464" stroke="#FFD04A" stroke-width="14" stroke-linecap="round"/>
    <line x1="562" y1="350" x2="576" y2="336" stroke="#FFD04A" stroke-width="14" stroke-linecap="round"/>
    <line x1="462" y1="450" x2="448" y2="464" stroke="#FFD04A" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Pulse wave at bottom -->
  <polyline points="180,900 300,900 360,840 420,960 480,880 540,920 600,870 660,920 720,900 844,900"
            fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
